<head>

<title>Alert Now — Civic Incident Response</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070d;--panel-bg:#0d1220;--panel-bg-soft:#10162699;--border:rgba(255,255,255,.08);--border-soft:rgba(255,255,255,.05);--text-primary:#f2f4f8;--text-secondary:#8b93a8;--text-tertiary:#5b6478;--red:#f5555f;--red-bg:rgba(245,85,95,.14);--amber:#f6a723;--amber-bg:rgba(246,167,35,.14);--teal:#34d3a4;--teal-bg:rgba(52,211,164,.14);--blue:#4c8dff;--blue-bg:rgba(76,141,255,.14);--radius-lg:22px;--radius-md:14px;--radius-sm:8px}
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:var(--bg);background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:26px 26px;color:var(--text-primary);font-family:Inter,-apple-system,"Segoe UI",sans-serif;line-height:1.5}button,input,textarea,select{font:inherit}button{cursor:pointer}.mono{font-family:"JetBrains Mono",monospace}.hidden{display:none!important}
/* Shared visual language intentionally follows the supplied second design: dark civic-tech surfaces, Inter + JetBrains Mono, subtle borders, red/amber/teal/blue severity accents. */
.app{min-height:100vh}.topbar{height:70px;border-bottom:1px solid var(--border);background:rgba(5,7,13,.9);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:50}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(180deg,#ff6a5f,#f5555f);display:grid;place-items:center}.brand-sub{font-size:.68rem;color:var(--text-tertiary);letter-spacing:.12em;font-family:"JetBrains Mono";text-transform:uppercase}.top-actions{display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;background:#1a2236;display:grid;place-items:center;font-size:.8rem;font-weight:700}.btn{border:1px solid var(--border);background:#111827;color:var(--text-primary);border-radius:10px;padding:10px 14px;font-weight:700}.btn:hover{background:#182137}.btn.primary{border-color:transparent;background:linear-gradient(180deg,#ff6a5f,#f5555f);color:#fff}.btn.blue{border-color:transparent;background:linear-gradient(180deg,#5b96ff,#3f7bff);color:#fff}.btn.ghost{background:transparent}.btn:disabled{opacity:.45;cursor:not-allowed}
/* auth */.auth-shell{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 20% 20%,rgba(76,141,255,.08),transparent 35%),radial-gradient(circle at 80% 70%,rgba(245,85,95,.06),transparent 30%)}.auth-card{width:min(980px,100%);display:grid;grid-template-columns:1.05fr .95fr;border:1px solid var(--border);border-radius:28px;background:rgba(13,18,32,.92);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}.auth-visual{padding:48px;background:linear-gradient(160deg,rgba(76,141,255,.1),rgba(245,85,95,.04) 55%,transparent);border-right:1px solid var(--border)}.auth-visual h1{font-size:2.4rem;line-height:1.05;margin:18px 0 14px}.auth-visual p{color:var(--text-secondary);max-width:440px}.signal-list{display:grid;gap:10px;margin-top:30px}.signal{display:flex;gap:12px;align-items:center;padding:13px;border:1px solid var(--border-soft);border-radius:12px;background:rgba(255,255,255,.025)}.signal-dot{width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px var(--teal-bg)}.auth-form{padding:42px}.eyebrow{font:700 .68rem "JetBrains Mono";letter-spacing:.14em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:12px}.auth-form h2{font-size:1.55rem}.muted{color:var(--text-secondary)}.role-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:24px 0}.role-switch button{padding:12px;border-radius:10px;border:1px solid var(--border);background:#0a0f1c;color:var(--text-secondary);font-weight:700}.role-switch button.active{background:var(--blue-bg);border-color:rgba(76,141,255,.35);color:#fff}.field{margin-bottom:16px}.field label{display:block;font:700 .68rem "JetBrains Mono";letter-spacing:.1em;color:var(--text-tertiary);margin-bottom:8px}.input-wrap{position:relative}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border-soft);background:rgba(255,255,255,.035);color:var(--text-primary);border-radius:10px;padding:12px 13px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(76,141,255,.55);box-shadow:0 0 0 3px var(--blue-bg)}.toggle-pass{position:absolute;right:8px;top:7px;border:0;background:transparent;color:var(--text-secondary);padding:6px}.form-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 20px;font-size:.82rem}.check{display:flex;gap:8px;align-items:center;color:var(--text-secondary)}.link{border:0;background:transparent;color:#74a6ff;font-weight:700}.error{color:var(--red);font-size:.78rem;margin-top:6px}.auth-note{margin-top:16px;text-align:center;font-size:.8rem;color:var(--text-tertiary)}
/* citizen */.citizen-layout{max-width:1100px;margin:0 auto;padding:28px 22px 100px}.citizen-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}.phone-frame{background:linear-gradient(180deg,#131a2b,#0c111d);border:1px solid var(--border);border-radius:36px;padding:14px 14px 20px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);max-width:520px;margin:0 auto}.phone-notch{width:90px;height:6px;background:rgba(255,255,255,.15);border-radius:99px;margin:4px auto 18px}.phone-screen{padding:0 8px}.phone-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.phone-header h1{font-size:1.25rem}.close-btn{width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.06);color:var(--text-secondary)}.capture-zone{position:relative;height:180px;border-radius:var(--radius-md);border:1.5px dashed rgba(255,255,255,.14);background:linear-gradient(rgba(255,255,255,.02),rgba(255,255,255,.02)),repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(255,255,255,.03) 60px),repeating-linear-gradient(90deg,transparent,transparent 59px,rgba(255,255,255,.03) 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-tertiary);cursor:pointer;overflow:hidden;margin-bottom:14px}.capture-zone img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.capture-zone .camera-icon{font-size:1.6rem}.capture-zone .hint{font-size:.85rem}.capture-btn{width:100%;padding:12px;border-radius:var(--radius-sm);border:0;background:#1a2236;color:var(--text-primary);font-weight:600;margin-bottom:22px}.ai-panel{border-radius:var(--radius-sm);padding:13px 14px;margin:-12px 0 20px;font-size:.84rem;border:1px solid var(--border-soft)}.ai-panel.ai-loading{display:flex;align-items:center;gap:10px;background:var(--blue-bg);color:#cfe0ff;border-color:rgba(76,141,255,.25)}.ai-spinner{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:ai-spin .8s linear infinite;flex-shrink:0}@keyframes ai-spin{to{transform:rotate(360deg)}}.ai-panel.ai-error{background:var(--red-bg);color:#ffd7da;border-color:rgba(245,85,95,.3);display:flex;flex-wrap:wrap;gap:6px;align-items:center}.ai-panel.ai-error .link{color:#fff;text-decoration:underline;padding:0}.ai-panel.ai-done{background:var(--teal-bg);border-color:rgba(52,211,164,.3)}.ai-panel-head{font:700 .68rem "JetBrains Mono";letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}.ai-panel-desc{color:var(--text-primary);margin-bottom:10px}.ai-panel-tags{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.ai-panel-actions{display:flex;gap:8px}.ai-panel-actions .btn{padding:8px 12px;font-size:.8rem}.field-label{font:700 .68rem "JetBrains Mono";letter-spacing:.1em;color:var(--text-tertiary);margin-bottom:8px}.location-row{display:flex;gap:10px;background:rgba(255,255,255,.03);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:20px}.location-dot{width:9px;height:9px;border-radius:50%;background:var(--teal);margin-top:6px;flex-shrink:0}.location-row .addr{font-size:.92rem;font-weight:500}.location-row .coords{font-size:.78rem;color:var(--text-tertiary)}.desc-input{min-height:76px;resize:none}.submit-btn{width:100%;padding:14px;border-radius:var(--radius-sm);border:0;font-weight:700;background:linear-gradient(180deg,#ff6a5f,#f5555f);color:#fff}.submit-btn:disabled{background:#3a2b31;color:var(--text-tertiary);cursor:not-allowed}.confirm-msg{text-align:center;color:var(--teal);font-size:.8rem;margin-top:10px;min-height:1em}.tab-bar{display:flex;justify-content:space-around;margin-top:22px;padding-top:16px;border-top:1px solid var(--border-soft)}.tab-item{background:none;border:0;color:var(--text-tertiary);font-size:.72rem;font-family:"JetBrains Mono";display:flex;flex-direction:column;align-items:center;gap:4px}.tab-item.active{color:var(--amber)}.incident-mini{border:1px solid var(--border-soft);border-radius:12px;padding:12px;margin-bottom:9px;background:rgba(255,255,255,.02)}.incident-mini .row{display:flex;justify-content:space-between;gap:8px}.badge{font:700 .6rem "JetBrains Mono";padding:3px 7px;border-radius:6px}.badge.HIGH{background:var(--red-bg);color:var(--red)}.badge.MEDIUM{background:var(--amber-bg);color:var(--amber)}.badge.LOW{background:var(--teal-bg);color:var(--teal)}.status{font-size:.76rem;color:var(--text-secondary);margin-top:5px}.citizen-side{display:grid;gap:12px}.info-card{background:var(--panel-bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}.info-card h3{font-size:1rem;margin-bottom:8px}.kpi-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:.84rem}.kpi-line:last-child{border-bottom:0}.empty{padding:34px 12px;text-align:center;color:var(--text-tertiary);font-size:.84rem}
/* authority */.authority-shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 70px)}.sidebar{border-right:1px solid var(--border);background:#080c15;padding:22px 14px;position:sticky;top:70px;height:calc(100vh - 70px)}.nav{display:grid;gap:5px;margin-top:24px}.nav button{border:0;background:transparent;color:var(--text-secondary);padding:11px 12px;border-radius:9px;text-align:left;font-weight:700}.nav button.active,.nav button:hover{background:rgba(76,141,255,.08);color:#fff}.authority-main{padding:28px;min-width:0}.dashboard-header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:22px}.dashboard-header h1{font-size:1.6rem}.dashboard-header .sub{color:var(--text-secondary);font-size:.88rem}.header-right{display:flex;gap:8px;flex-wrap:wrap}.stat-pill{border:1px solid var(--border);border-radius:12px;padding:8px 16px;text-align:center;min-width:80px;background:rgba(255,255,255,.015)}.stat-pill .num{font-size:1.2rem;font-weight:800;font-family:"JetBrains Mono"}.stat-pill .label{font-size:.6rem;letter-spacing:.08em;color:var(--text-tertiary);font-family:"JetBrains Mono"}.stat-pill.high .num{color:var(--red)}.stat-pill.medium .num{color:var(--amber)}.stat-pill.low .num{color:var(--teal)}.dashboard-body{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px}.incident-feed{max-height:620px;overflow:auto;border:1px solid var(--border-soft);border-radius:var(--radius-md)}.incident-row{display:flex;gap:12px;padding:14px 16px;border:0;border-bottom:1px solid var(--border-soft);background:none;color:inherit;width:100%;text-align:left}.incident-row:hover{background:rgba(255,255,255,.02)}.incident-row.selected{background:rgba(76,141,255,.06);box-shadow:inset 3px 0 var(--blue)}.row-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}.row-icon.HIGH{background:var(--red-bg)}.row-icon.MEDIUM{background:var(--amber-bg)}.row-icon.LOW{background:var(--teal-bg)}.row-main{flex:1;min-width:0}.row-top{display:flex;justify-content:space-between;gap:8px}.row-title{font-weight:700;font-size:.9rem}.row-time{font:400 .65rem "JetBrains Mono";color:var(--text-tertiary);white-space:nowrap}.row-location{font-size:.78rem;color:var(--text-secondary);margin-top:2px}.row-badges{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.badge.dept{background:var(--blue-bg);color:var(--blue)}.map-detail-col{display:flex;flex-direction:column;gap:20px}.map-area{position:relative;height:360px;border-radius:var(--radius-md);border:1px solid var(--border-soft);background:#0a0f1c;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:22px 22px;overflow:hidden}.map-grid{position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.5%,rgba(255,255,255,.035) 50%,transparent 50.5%),linear-gradient(transparent 49.5%,rgba(255,255,255,.035) 50%,transparent 50.5%);background-size:90px 90px}.pin{position:absolute;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid rgba(5,7,13,.8);cursor:pointer}.pin.HIGH{background:var(--red)}.pin.MEDIUM{background:var(--amber)}.pin.LOW{background:var(--teal)}.pin.selected{width:17px;height:17px;box-shadow:0 0 0 6px rgba(245,85,95,.12)}.detail-card{border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:16px;display:flex;gap:16px;background:rgba(255,255,255,.015)}.detail-thumb{width:96px;height:96px;border-radius:12px;flex-shrink:0;background:radial-gradient(circle at 30% 30%,var(--amber),#7a2f10)}.detail-main{flex:1;min-width:0}.detail-top{display:flex;justify-content:space-between;gap:10px}.detail-title{font-weight:800}.severity-tag{font:700 .62rem "JetBrains Mono";padding:4px 9px;border-radius:6px;white-space:nowrap}.severity-tag.HIGH{background:var(--red-bg);color:var(--red)}.severity-tag.MEDIUM{background:var(--amber-bg);color:var(--amber)}.severity-tag.LOW{background:var(--teal-bg);color:var(--teal)}.detail-meta{font:400 .68rem "JetBrains Mono";color:var(--text-tertiary);margin:5px 0 10px}.detail-desc{color:var(--text-secondary);font-size:.84rem}.workflow{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.workflow button{border:1px solid var(--border);background:#101626;color:var(--text-secondary);border-radius:7px;padding:6px 8px;font-size:.7rem}.workflow button:hover{color:#fff;border-color:rgba(76,141,255,.35)}.analytics{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;margin-top:20px}.chart-card{background:var(--panel-bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}.bars{display:flex;align-items:flex-end;gap:12px;height:150px;margin-top:18px}.bar{flex:1;background:linear-gradient(180deg,#5b96ff,#244c9b);border-radius:6px 6px 2px 2px;min-height:8px}.bar-labels{display:flex;gap:12px;margin-top:8px;color:var(--text-tertiary);font:400 .62rem "JetBrains Mono"}.bar-labels span{flex:1;text-align:center}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.notice{border:1px solid var(--border);border-radius:12px;padding:14px;background:rgba(255,255,255,.02);font-size:.83rem}.toast{position:fixed;right:20px;bottom:20px;z-index:100;padding:12px 16px;border-radius:10px;background:#111827;border:1px solid var(--border);box-shadow:0 20px 40px rgba(0,0,0,.4);color:#fff}.toast.success{border-color:rgba(52,211,164,.3)}
@media(max-width:1024px){.authority-shell{grid-template-columns:72px 1fr}.sidebar{padding:18px 10px}.nav button{font-size:0;text-align:center}.nav button::first-letter{font-size:1rem}.dashboard-body{grid-template-columns:1fr}.incident-feed{max-height:360px}.analytics{grid-template-columns:1fr}}
@media(max-width:768px){.topbar{padding:0 16px}.brand-sub{display:none}.auth-card{grid-template-columns:1fr}.auth-visual{display:none}.auth-form{padding:28px}.citizen-grid{grid-template-columns:1fr}.citizen-side{display:none}.authority-shell{display:block}.sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:64px;border-right:0;border-top:1px solid var(--border);z-index:40;padding:7px;background:#080c15}.nav{grid-template-columns:repeat(4,1fr);margin:0}.nav button{font-size:.62rem;text-align:center;padding:8px}.authority-main{padding:18px 14px 90px}.dashboard-header h1{font-size:1.35rem}.header-right{width:100%}.stat-pill{flex:1}.detail-card{flex-direction:column}.detail-thumb{width:100%;height:150px}.settings-grid{grid-template-columns:1fr}}
@media(max-width:480px){.citizen-layout{padding:14px 10px 80px}.phone-frame{border-radius:28px;padding:10px}.auth-shell{padding:12px}.auth-form{padding:22px}.form-row{align-items:flex-start;flex-direction:column}.top-actions .btn{display:none}.map-area{height:280px}}

/* Fixed public navigation and theme controls — added only to this file */
.public-bottom-nav{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:1000;width:min(620px,calc(100vw - 32px));display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:7px;border:1px solid var(--border);border-radius:18px;background:rgba(13,18,32,.96);backdrop-filter:blur(16px);box-shadow:0 18px 45px rgba(0,0,0,.35)}
.bottom-nav-item{min-height:54px;border:0;border-radius:12px;background:transparent;color:var(--text-secondary);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:inherit;font-weight:700;cursor:pointer}.bottom-nav-item span{font-size:1.1rem;line-height:1}.bottom-nav-item small{font-size:.64rem}.bottom-nav-item:hover,.bottom-nav-item.active{background:rgba(76,141,255,.16);color:var(--text-primary)}
body.light-theme{--bg:#f4f7fb;--panel-bg:#fff;--panel-bg-soft:#ffffffcc;--border:rgba(15,23,42,.12);--border-soft:rgba(15,23,42,.08);--text-primary:#172033;--text-secondary:#5b6578;--text-tertiary:#7b8495;--blue-bg:rgba(76,141,255,.12);--red-bg:rgba(245,85,95,.12);--amber-bg:rgba(246,167,35,.12);--teal-bg:rgba(52,211,164,.12)}
body.light-theme .topbar{background:rgba(255,255,255,.92)}body.light-theme .sidebar{background:#fff}body.light-theme .phone-frame{background:linear-gradient(180deg,#fff,#f4f7fb)}body.light-theme .public-bottom-nav{background:rgba(255,255,255,.96);box-shadow:0 18px 45px rgba(15,23,42,.16)}body.light-theme .bottom-nav-item{color:var(--text-secondary)}body.light-theme .bottom-nav-item.active{color:var(--text-primary)}
.citizen-layout{padding-bottom:120px}
@media(max-width:700px){.public-bottom-nav{bottom:8px;width:calc(100vw - 16px)}.bottom-nav-item{min-height:50px}.bottom-nav-item small{font-size:.58rem}}

/* Light theme contrast fixes */
body.light-theme .btn {
  background: #ffffff;
  color: #172033;
  border-color: rgba(15,23,42,.14);
}
body.light-theme .btn:hover {
  background: #eef2f7;
}
body.light-theme .btn.ghost {
  background: transparent;
  color: #172033;
}
body.light-theme .capture-btn {
  background: #e9eef5;
  color: #172033;
}
body.light-theme .field input,
body.light-theme .field select,
body.light-theme .field textarea {
  background: #ffffff;
  color: #172033;
  border-color: rgba(15,23,42,.14);
}
body.light-theme .field input::placeholder,
body.light-theme .field textarea::placeholder {
  color: #7b8495;
  opacity: 1;
}
body.light-theme .location-row,
body.light-theme .incident-mini,
body.light-theme .signal,
body.light-theme .notice {
  background: #ffffff;
  color: #172033;
}
body.light-theme .sidebar {
  background: #ffffff;
}
body.light-theme .nav button {
  color: #5b6578;
}
body.light-theme .nav button.active,
body.light-theme .nav button:hover {
  color: #172033;
}
body.light-theme .workflow button {
  background: #ffffff;
  color: #172033;
  border-color: rgba(15,23,42,.14);
}
body.light-theme .incident-row {
  color: #172033;
}
body.light-theme .incident-row:hover {
  background: rgba(76,141,255,.06);
}
body.light-theme .detail-card,
body.light-theme .chart-card,
body.light-theme .info-card {
  background: #ffffff;
  color: #172033;
}
body.light-theme .detail-meta,
body.light-theme .muted,
body.light-theme .status,
body.light-theme .row-location,
body.light-theme .row-time {
  color: #5b6578;
}
body.light-theme .detail-desc {
  color: #4d596d;
}
body.light-theme .detail-meta b,
body.light-theme .detail-card b {
  color: #172033 !important;
}
body.light-theme .toast {
  background: #ffffff;
  color: #172033;
  border-color: rgba(15,23,42,.14);
  box-shadow: 0 20px 40px rgba(15,23,42,.16);
}
body.light-theme .phone-notch {
  background: rgba(15,23,42,.16);
}
body.light-theme .close-btn {
  background: #eef2f7;
  color: #4d596d;
}
body.light-theme .tab-item {
  color: #7b8495;
}
body.light-theme .tab-item.active {
  color: #9a6500;
}
/* Important: profile logout button remains visible in light mode */
body.light-theme .profile-section .btn,
body.light-theme .phone-screen .btn {
  color: #172033;
}


/* Profile navigation visibility fix */
.public-bottom-nav .profile-nav {
  display: flex !important;
  visibility: visible !important;
  opacity: 1 !important;
  color: var(--text-secondary) !important;
}
.public-bottom-nav .profile-nav .profile-icon {
  display: block !important;
  visibility: visible !important;
  font-size: 1.15rem !important;
  line-height: 1 !important;
}
.public-bottom-nav .profile-nav small {
  display: block !important;

async function apiFetch(url,options={}){
  const res=await fetch(url,{credentials:'same-origin',...options});
  let body=null;
  try{body=await res.json()}catch(e){/* no JSON body */}

function statusNext(i){return ['Submitted','Under Review','Assigned','In Progress','Resolved'].indexOf(i.status)}
function iconFor(type){return ({'Fire':'🔥','Traffic Signal Fault':'🚦','Water Leak':'💧','Streetlight Outage':'💡','Fallen Tree':'🌳','Illegal Dumping':'🗑️','Pothole':'⚠️','Fight / Assault':'🚨','Road Accident':'🚗','Medical Emergency':'🚑'})[type]||'•'}
function loginView(){
  if(authMode==='register'){
    return `<div class="auth-shell"><div class="auth-card"><section class="auth-visual"><div class="brand"><span class="brand-mark">!</span><div>Alert Now<div class="brand-sub">Civic incident response</div></div></div><h1>Create your citizen account.</h1><p>Register once to submit reports, track response progress and manage your civic profile.</p><div class="signal-list"><div class="signal"><span class="signal-dot"></span><div><b>Fast reporting</b><div class="muted">Keep your account ready when an incident needs attention.</div></div></div><div class="signal"><span class="signal-dot" style="background:var(--blue);box-shadow:0 0 0 4px var(--blue-bg)"></span><div><b>Private account</b><div class="muted">Your account details stay separate from public incident information.</div></div></div><div class="signal"><span class="signal-dot" style="background:var(--amber);box-shadow:0 0 0 4px var(--amber-bg)"></span><div><b>Track every report</b><div class="muted">View submitted, assigned, in-progress and resolved reports.</div></div></div></div></section><section class="auth-form"><div class="eyebrow">Citizen registration</div><h2>Create your account</h2><p class="muted" style="font-size:.86rem;margin-top:4px">Enter your details to get started.</p><form onsubmit="createCitizenAccount(event)" style="margin-top:24px"><div class="field"><label>FULL NAME</label><input id="regName" autocomplete="name" placeholder="Your full name" required></div><div class="field"><label>EMAIL</label><input id="regEmail" type="email" autocomplete="email" placeholder="name@example.com" required></div><div class="field"><label>PHONE</label><input id="regPhone" type="tel" autocomplete="tel" placeholder="+91 98765 43210" required></div><div class="field"><label>PASSWORD</label><input id="regPass" type="password" autocomplete="new-password" placeholder="Minimum 6 characters" minlength="6" required></div><div class="field"><label>CONFIRM PASSWORD</label><input id="regConfirm" type="password" autocomplete="new-password" placeholder="Re-enter your password" minlength="6" required><div id="registerErr"></div></div><button class="btn primary" style="width:100%;padding:14px">Create citizen account</button></form><button class="btn ghost" style="width:100%;margin-top:12px" onclick="authMode='login';role='citizen';render()">← Back to citizen login</button><div class="auth-note">By creating an account, you can securely access your citizen reporting dashboard.</div></section></div></div>`;
  }
  return `<div class="auth-shell"><div class="auth-card"><section class="auth-visual"><div class="brand"><span class="brand-mark">!</span><div>Alert Now<div class="brand-sub">Civic incident response</div></div></div><h1>Report issues.<br>Route response.<br>Keep communities moving.</h1><p>A secure incident reporting service connecting residents with the teams responsible for public safety and municipal response.</p><div class="signal-list"><div class="signal"><span class="signal-dot"></span><div><b>Live response routing</b><div class="muted">Reports reach the appropriate desk with location and severity.</div></div></div><div class="signal"><span class="signal-dot" style="background:var(--blue);box-shadow:0 0 0 4px var(--blue-bg)"></span><div><b>Role-based access</b><div class="muted">Public reporting and internal operations remain separate.</div></div></div><div class="signal"><span class="signal-dot" style="background:var(--amber);box-shadow:0 0 0 4px var(--amber-bg)"></span><div><b>Premium civic experience</b><div class="muted">A clear, modern interface designed for fast action.</div></div></div></div></section><section class="auth-form"><div class="eyebrow">Secure access</div><h2>Welcome to Alert Now</h2><p class="muted" style="font-size:.86rem;margin-top:4px">Choose your account type to continue.</p><div class="role-switch"><button class="${role==='citizen'?'active':''}" onclick="setRole('citizen')">Citizen Login</button><button class="${role==='authority'?'active':''}" onclick="setRole('authority')">Authority Login</button></div><form onsubmit="doLogin(event)"><div class="field"><label>EMAIL OR PHONE</label><input id="loginId" autocomplete="username" placeholder="name@example.com or +91..." required><div id="loginErr"></div></div><div class="field"><label>PASSWORD</label><div class="input-wrap"><input id="loginPass" type="password" autocomplete="current-password" placeholder="Enter your password" required minlength="6"><button type="button" class="toggle-pass" onclick="togglePassword()">Show</button></div></div><div class="form-row"><label class="check"><input id="remember" type="checkbox"> Remember me</label><button type="button" class="link" onclick="toast('Password recovery instructions would be sent here.')">Forgot password?</button></div><button class="btn primary" style="width:100%;padding:14px" id="loginBtn">Sign in as ${role==='citizen'?'Citizen':'Authority'}</button></form>${role==='citizen'?'<div style="display:flex;align-items:center;gap:10px;margin-top:18px;color:var(--text-tertiary);font-size:.78rem"><span style="height:1px;background:var(--border);flex:1"></span>NEW TO ALERT NOW?<span style="height:1px;background:var(--border);flex:1"></span></div><button class="btn ghost" style="width:100%;margin-top:12px;border-color:rgba(91,140,255,.28);background:rgba(91,140,255,.06)" onclick="authMode=\'register\';render()">Create a new citizen account</button>':'<div class="auth-note">Authority access is restricted to approved operational accounts.</div>'}<div class="auth-note">${role==='citizen'?'Secure citizen access with report tracking and profile controls.':''}</div></section></div></div>`
}
function setRole(r){role=r;render()}
function togglePassword(){const i=document.getElementById('loginPass');const b=document.querySelector('.toggle-pass');i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Show':'Hide'}
async function createCitizenAccount(e){
  e.preventDefault();
  const name=document.getElementById('regName').value.trim();
  const email=document.getElementById('regEmail').value.trim().toLowerCase();
  const phone=document.getElementById('regPhone').value.trim();
  const pass=document.getElementById('regPass').value;
  const confirm=document.getElementById('regConfirm').value;
  const err=document.getElementById('registerErr');
  const btn=e.target.querySelector('button');
  if(pass!==confirm){err.innerHTML='<div class="error">Passwords do not match.</div>';return}
  if(btn)btn.disabled=true;
  try{
    const {user}=await apiFetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,phone,password:pass})});
    session={role:user.role,user:user.email||user.phone,name:user.name,id:user.id};
    authMode='login';
    await loadIncidents();
    toast('Citizen account created successfully');
    render();
  }catch(ex){
    err.innerHTML=`<div class="error">${esc(ex.message)}</div>`;
  }finally{
    if(btn)btn.disabled=false;
  }
}
async function doLogin(e){
  e.preventDefault();
  const id=document.getElementById('loginId').value.trim().toLowerCase();
  const pass=document.getElementById('loginPass').value;
  const err=document.getElementById('loginErr');
  const btn=document.getElementById('loginBtn');
  if(!id||pass.length<6){err.innerHTML='<div class="error">Enter valid sign-in details.</div>';return}
  if(btn)btn.disabled=true;
  try{
    const {user}=await apiFetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role,identifier:id,password:pass})});
    session={role:user.role,user:user.email||user.phone,name:user.name,id:user.id};
    await loadIncidents();
    toast('Signed in securely');
    render();
  }catch(ex){
    err.innerHTML=`<div class="error">${esc(ex.message)}</div>`;
  }finally{
    if(btn)btn.disabled=false;
  }
}
async function logout(){
  try{await apiFetch('/api/auth/logout',{method:'POST'})}catch(e){/* ignore */}
  session=null;incidents=[];selectedId=null;
  render();
}
function citizenView(){return `<div><header class="topbar"><div class="brand"><span class="brand-mark">!</span><div>Alert Now<div class="brand-sub">Citizen service</div></div></div><div class="top-actions"><button class="btn" onclick="setCitizenTab('profile')">Account</button><button class="btn primary" onclick="logout()">Log out</button></div></header><main class="citizen-layout"><div class="citizen-grid"><section class="phone-frame"><div class="phone-notch"></div><div class="phone-screen">${citizenTab==='report'?reportScreen():citizenTab==='reports'?reportsScreen():citizenTab==='nearby'?nearbyScreen():profileScreen()}<div class="public-bottom-nav"><button class="bottom-nav-item ${citizenTab==='report'?'active':''}" onclick="setCitizenTab('report')"><span>📷</span><small>Report</small></button><button class="bottom-nav-item ${citizenTab==='reports'?'active':''}" onclick="setCitizenTab('reports')"><span>🕘</span><small>My Reports</small></button><button class="bottom-nav-item ${citizenTab==='nearby'?'active':''}" onclick="setCitizenTab('nearby')"><span>📍</span><small>Nearby</small></button><button class="bottom-nav-item profile-nav ${citizenTab==='profile'?'active':''}" onclick="setCitizenTab('profile')"><span class="profile-icon">👤</span><small>Profile</small></button><button class="bottom-nav-item" onclick="toggleTheme()"><span id="themeIcon">☀️</span><small id="themeText">Light</small></button></div></div></section><aside class="citizen-side"><div class="info-card"><div class="eyebrow">Service status</div><h3>Response network online</h3><p class="muted" style="font-size:.8rem">Reports are being accepted and routed to local desks.</p></div><div class="info-card"><div class="eyebrow">Your activity</div><div class="kpi-line"><span>Open reports</span><b>${incidents.filter(i=>i.reportedById===session?.id&&i.status!=='Resolved').length}</b></div><div class="kpi-line"><span>Resolved</span><b>${incidents.filter(i=>i.reportedById===session?.id&&i.status==='Resolved').length}</b></div></div></aside></div></main></div>`}
function reportScreen(){return `<div id="reportView"><div class="phone-header"><div><div class="eyebrow" style="margin-bottom:4px">QUICK REPORT</div><h1>Report an incident</h1></div></div><input id="photoInput" type="file" accept="image/*,video/*" capture="environment" hidden onchange="handlePhoto(event)"><div class="capture-zone" id="captureZone" onclick="document.getElementById('photoInput').click()">${pendingPhoto?`<img src="${pendingPhoto}"><span class="hint" style="position:absolute;bottom:8px;background:rgba(5,7,13,.75);padding:4px 8px;border-radius:6px;color:#fff">Retake media</span>`:'<span class="camera-icon">📷</span><span class="hint">Tap to capture photo or video</span>'}</div><div style="display:flex;gap:8px;margin-bottom:22px"><button class="capture-btn" style="margin-bottom:0;flex:1" onclick="openWebcam()">📷 Use webcam</button><button class="capture-btn" style="margin-bottom:0;flex:1" onclick="document.getElementById('photoInput').click()">${pendingPhoto?'Retake (upload)':'Upload photo'}</button></div>${aiPanel()}<div class="field-label">CATEGORY</div><div class="field"><select id="category"><option>Traffic Signal Fault</option><option>Fire</option><option>Water Leak</option><option>Streetlight Outage</option><option>Fallen Tree</option><option>Illegal Dumping</option><option>Pothole</option><option>Fight / Assault</option><option>Road Accident</option><option>Medical Emergency</option></select></div><div class="field-label">LOCATION</div><div class="location-row"><span class="location-dot"></span><div><div class="addr" id="locationAddr">Current location</div><div class="coords" id="locationCoords">Location permission will be requested when you submit.</div></div></div><button class="btn ghost" style="width:100%;margin:-8px 0 18px" onclick="detectLocation()">Use current location</button><div class="field-label">SEVERITY</div><div class="field"><select id="severity"><option>Medium</option><option>High</option><option>Low</option></select></div><div class="field-label">SHORT DESCRIPTION</div><div class="field"><textarea id="descInput" class="desc-input" placeholder="Describe what is happening and what responders should know."></textarea></div><button class="submit-btn" id="submitBtn" onclick="submitReport()" ${pendingPhoto?'':'disabled'}>${pendingPhoto?'Submit report':'Capture media to continue'}</button><div class="confirm-msg" id="confirmMsg"></div></div>`}
function handlePhoto(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{pendingPhoto=r.result;aiState='idle';aiResult=null;lastAiRaw=null;render();resizeImageForAI(pendingPhoto).then(analyzePhotoWithAI)};r.readAsDataURL(f)}

// Live in-browser camera capture (getUserMedia) — the file input's
// capture="environment" attribute only opens a real camera view on mobile;
// on desktop it just opens a plain file picker. This gives every device a
// real camera preview + snapshot instead.
let webcamStream=null;
async function openWebcam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    toast('Webcam access is not supported in this browser — use Upload photo instead',false);return;
  }
  document.body.insertAdjacentHTML('beforeend',`<div class="profile-modal" id="webcamModal" onclick="if(event.target===this)closeWebcam()"><div class="profile-modal-card" style="width:min(560px,100%)"><div class="profile-modal-head"><div><div class="eyebrow">LIVE CAMERA</div><h2>Capture a photo</h2></div><button class="profile-modal-close" onclick="closeWebcam()">×</button></div><video id="webcamVideo" autoplay playsinline muted style="width:100%;border-radius:14px;background:#000;max-height:360px;object-fit:cover;display:block"></video><p class="muted" id="webcamHint" style="font-size:.8rem;margin-top:10px">Starting camera…</p><div style="display:flex;gap:8px;margin-top:14px"><button class="btn primary" style="flex:1" onclick="captureWebcamPhoto()">Capture</button><button class="btn ghost" style="flex:1" onclick="closeWebcam()">Cancel</button></div></div></div>`);
  try{
    webcamStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    const video=document.getElementById('webcamVideo');
    if(video){video.srcObject=webcamStream}
    const hint=document.getElementById('webcamHint');if(hint)hint.textContent='Point the camera at the issue, then tap Capture.';
  }catch(err){
    console.error('Webcam error',err);
    toast('Could not access the camera — check browser/site permissions',false);
    closeWebcam();
  }
}
function closeWebcam(){
  if(webcamStream){webcamStream.getTracks().forEach(t=>t.stop());webcamStream=null}

}
function captureWebcamPhoto(){
  const video=document.getElementById('webcamVideo');
  if(!video||!video.videoWidth){toast('Camera is still starting — try again in a second',false);return}
  const canvas=document.createElement('canvas');
  canvas.width=video.videoWidth;canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);

  resizeImageForAI(dataUrl).then(analyzePhotoWithAI);

function resizeImageForAI(dataUrl){
  return new Promise(resolve=>{
    if(!dataUrl.startsWith('data:image/')){resolve(dataUrl);return}
    const img=new Image();
    img.onload=()=>{
      const maxEdge=1568;
      const scale=Math.min(1,maxEdge/Math.max(img.width,img.height));
      if(scale===1){resolve(dataUrl);return}
      const canvas=document.createElement('canvas');
      canvas.width=Math.round(img.width*scale);
      canvas.height=Math.round(img.height*scale);
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      resolve(canvas.toDataURL('image/jpeg',0.85));
    };
    img.onerror=()=>resolve(dataUrl);
    img.src=dataUrl;
  });
}

function aiPanel(){
  if(!pendingPhoto||aiState==='idle')return '';
  if(aiState==='analyzing')return `<div class="ai-panel ai-loading"><span class="ai-spinner"></span><span>Analyzing photo with AI…</span></div>`;
  if(aiState==='error')return `<div class="ai-panel ai-error"><span>AI analysis failed — you can describe it manually, or</span><button type="button" class="link" onclick="retryAiAnalysis()">try again</button></div>`;
  if(aiState==='done'&&aiResult)return `<div class="ai-panel ai-done"><div class="ai-panel-head">✨ AI suggestion</div><div class="ai-panel-desc">${esc(aiResult.description)}</div>${aiResult.category&&aiResult.severity?`<div class="ai-panel-tags"><span class="badge dept">${esc(aiResult.category)}</span><span class="badge ${aiResult.severity.toUpperCase()}">${esc(aiResult.severity)}</span></div>`:''}<div class="ai-panel-actions">${aiResult.category&&aiResult.severity?'<button type="button" class="btn blue" onclick="applyAiSuggestion()">Use this</button>':''}<button type="button" class="btn ghost" onclick="dismissAiSuggestion()">Dismiss</button></div></div>`;
  return '';
}
const AI_CATEGORIES=['Traffic Signal Fault','Fire','Water Leak','Streetlight Outage','Fallen Tree','Illegal Dumping','Pothole','Fight / Assault','Road Accident','Medical Emergency'];

// Maps the hazard tag returned by our local CLIP model (see hazard_model.py)
// to this app's category list + a default severity for that hazard type.
const HAZARD_TO_REPORT={
  FIRE:{category:'Fire',severity:'High'},
  SMOKE:{category:'Fire',severity:'High'},
  FLOOD:{category:'Water Leak',severity:'Medium'},
  POTHOLE:{category:'Pothole',severity:'Medium'},
  FIGHT:{category:'Fight / Assault',severity:'High'},
  ACCIDENT:{category:'Road Accident',severity:'High'},
  INJURY:{category:'Medical Emergency',severity:'High'}
};
// Natural-language phrasing for each hazard tag, used in the generated
// description instead of just echoing the raw CLIP label text (which reads
// awkwardly for some of them, e.g. "Detected: a pothole ... in a road").
const HAZARD_DESCRIPTIONS={
  FIRE:'Active fire with visible flames',
  SMOKE:'Thick smoke',
  FLOOD:'Flooding or water damage',
  POTHOLE:'A pothole or damaged road surface',
  FIGHT:'A physical altercation between people',
  ACCIDENT:'A car crash or traffic accident',
  INJURY:'A person appearing injured'
};

async function analyzePhotoWithAI(dataUrl){
  aiState='analyzing';lastAiRaw=null;render();
  try{
    // Send the photo to our own local model server (server.py / hazard_model.py)
    // instead of calling a third-party API from the browser.
    const blob=await (await fetch(dataUrl)).blob();
    const form=new FormData();
    form.append('image',blob,'photo.jpg');

    const response=await fetch('/analyze',{method:'POST',body:form});
    if(!response.ok){
      const errBody=await response.text().catch(()=>'');
      console.error('AI request failed',response.status,errBody);
      throw new Error('AI request failed ('+response.status+')');
    }
    const result=await response.json();
    if(result.error) throw new Error(result.error);

    const confidencePct=Math.round((result.confidence||0)*100);
    lastAiRaw={label:result.label,hazard:result.hazard||'',confidence:result.confidence||0};

    if(result.is_hazard && HAZARD_TO_REPORT[result.hazard]){
      const mapped=HAZARD_TO_REPORT[result.hazard];
      const niceDescription=HAZARD_DESCRIPTIONS[result.hazard]||result.label.replace(/^a photo of /i,'');
      aiResult={
        description:`${niceDescription} detected (${confidencePct}% confidence).`,
        category:mapped.category,
        severity:mapped.severity
      };
    }else{
      // Nothing hazardous recognized — let the citizen categorize manually,
      // but still surface what the model saw.
      aiResult={
        description:`No clear hazard detected — best guess: ${result.label.replace(/^a photo of /i,'')} (${confidencePct}% confidence). Please choose a category manually.`,
        category:null,
        severity:null
      };
    }
    aiState='done';
  }catch(err){
    console.error('AI photo analysis failed',err);
    aiState='error';
  }
  render();
}
function applyAiSuggestion(){
  if(!aiResult)return;
  const descEl=document.getElementById('descInput');
  const catEl=document.getElementById('category');
  const sevEl=document.getElementById('severity');
  if(descEl)descEl.value=aiResult.description;
  if(catEl)catEl.value=aiResult.category;
  if(sevEl)sevEl.value=aiResult.severity;
  toast('AI suggestion applied — feel free to edit it');
}
function dismissAiSuggestion(){aiState='idle';aiResult=null;render()}
function retryAiAnalysis(){if(pendingPhoto)analyzePhotoWithAI(pendingPhoto)}
function detectLocation(){navigator.geolocation?.getCurrentPosition(p=>{document.getElementById('locationCoords').textContent=`${p.coords.latitude.toFixed(4)}, ${p.coords.longitude.toFixed(4)}`;toast('Location detected')},()=>toast('Location permission was not available',false))||toast('Location is not supported',false)}
const DEPT_FOR_CATEGORY={'Fire':'FIRE DEPT.','Water Leak':'PUBLIC WORKS','Fight / Assault':'POLICE','Road Accident':'POLICE / TRAFFIC','Medical Emergency':'MEDICAL / EMS'};
async function submitReport(){
  if(!pendingPhoto){toast('Capture media before submitting',false);return}
  const submitBtn=document.getElementById('submitBtn');
  const type=document.getElementById('category').value;
  const sev=document.getElementById('severity').value;
  const desc=document.getElementById('descInput').value.trim()||'No description provided.';
  const loc=document.getElementById('locationCoords').textContent;
  if(submitBtn)submitBtn.disabled=true;
  try{
    const blob=await (await fetch(pendingPhoto)).blob();
    const form=new FormData();
    form.append('photo',blob,'photo.jpg');
    form.append('type',type);
    form.append('severity',sev);
    form.append('description',desc);
    form.append('locationDetail',loc);
    if(lastAiRaw){
      form.append('aiLabel',lastAiRaw.label||'');
      form.append('aiHazard',lastAiRaw.hazard||'');
      form.append('aiConfidence',String(lastAiRaw.confidence||0));
    }
    const {incident}=await apiFetch('/api/incidents',{method:'POST',body:form});
    incidents.unshift(incident);
    selectedId=incident.id;
    pendingPhoto=null;aiState='idle';aiResult=null;lastAiRaw=null;
    citizenTab='reports';
    toast('Report submitted. Reference AN-'+String(incident.id).slice(-4));
    render();
  }catch(ex){
    toast(ex.message||'Could not submit report',false);
  }finally{
    if(submitBtn)submitBtn.disabled=false;
  }
}

  saveProfilePrefs(p);
  closeProfileModal();
  toast('Emergency contact saved');
  render();

function saveProfileLocation(){
  const value=document.getElementById('savedLoc')?.value.trim();
